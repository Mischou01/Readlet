<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Readlet's app icon: the logo's two pebbles on a soft aura. To update src-tauri/icons/,
       render this to a 1024 px PNG with a transparent background and run
       `bun tauri icon that.png`. -->
  <defs>
    <radialGradient id="peach" cx="0.22" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#F4C6AF" />
      <stop offset="1" stop-color="#F4C6AF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="periwinkle" cx="0.84" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#C5CFF8" />
      <stop offset="1" stop-color="#C5CFF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sage" cx="0.62" cy="0.92" r="0.62">
      <stop offset="0" stop-color="#C2D8C8" />
      <stop offset="1" stop-color="#C2D8C8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="1" flood-color="#2E2A3B" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="#EDE9EC" />
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#peach)" />
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#periwinkle)" />
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#sage)" />
  <g filter="url(#shadow)" transform="translate(512 512) scale(20) translate(-15.5 -15)">
    <ellipse cx="12" cy="16" rx="8" ry="10.5" transform="rotate(-16 12 16)" fill="#2E2A3B" />
    <ellipse cx="19" cy="14" rx="7.5" ry="10" transform="rotate(18 19 14)" fill="#A0566A" opacity="0.88" />
  </g>
</svg>
