# Checks every push and pull request: types, lint, formatting and tests for the UI and the Rust
# core. Pushes to main also build the Linux packages and publish them as a pre-release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: UI checks (types, lint, formatting, tests)
        run: bun run check

      - name: Build the UI
        run: bun run build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run tauri build --bundles deb,rpm

      # A rolling pre-release rather than workflow artifacts: release files don't count against the
      # account's Actions storage quota.
      - name: Publish the packages as the "main-build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view main-build > /dev/null 2>&1; then
            gh release delete main-build --cleanup-tag --yes
          fi
          gh release create main-build --prerelease --target "$GITHUB_SHA" \
            --title "Latest build from main" \
            --notes "Built from $GITHUB_SHA. Replaced on every push to main." \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm
